# Git hooks for capstone-project-team-10.
#
# Installed automatically by the `prepare` script on `npm install`.
# To run a hook by hand:      npx lefthook run pre-commit
# To skip hooks for a commit: git commit --no-verify
#
# The application is Python, so oxlint and oxfmt only ever see the few
# JavaScript and TypeScript files that exist here (today only the anti-slop
# plugin, which .oxlintrc.json and .oxfmtrc.json both ignore). Only staged files
# are checked, so hook time stays proportional to the change.

pre-commit:
  parallel: true
  jobs:
    - name: oxfmt
      glob: "*.{js,jsx,mjs,cjs,ts,tsx}"
      # --no-error-on-unmatched-pattern: staged files that are all ignored (a commit
      # that only touches anti-slop/) match nothing, and both tools exit non-zero
      # on that by default, which would block the commit.
      run: npx oxfmt --check --no-error-on-unmatched-pattern {staged_files}
    - name: oxlint
      glob: "*.{js,jsx,mjs,cjs,ts,tsx}"
      # --quiet reports errors only, so warnings do not bury the errors that block.
      run: npx oxlint --quiet --no-error-on-unmatched-pattern {staged_files}
