[pytest]
testpaths = tests
# Every module in src/ imports as though src/ were the root (from classes.app import ...).
# The repository root is on the path too, for tests of the root-level build_executable.py.
pythonpath = src .
# `slow` is applied in tests/conftest.py to every test that builds the main window, and by hand
# to the few others that take seconds. `python -m pytest -m "not slow"` is the quick loop.
markers =
    slow: builds brachify's main window or otherwise takes seconds; leave out with -m "not slow"
